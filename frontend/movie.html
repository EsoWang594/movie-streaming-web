<h2 id="title"></h2>
<div id="detail"></div>

<button onclick="watch()">▶ Xem phim</button>
<div id="player"></div>

<script>
let movie;
const id = new URLSearchParams(location.search).get('id');

fetch(`http://localhost:5000/api/movies/${id}`)
  .then(r => r.json())
  .then(m => {
    movie = m;
    document.getElementById('title').innerText = m.title;
    document.getElementById('detail').innerHTML = `
      <iframe width="560" height="315" src="${m.trailer}" frameborder="0"></iframe>
      <p>${m.description}</p>
    `;
  });

function watch() {
  if (!movie.videoUrl) {
    alert("Phim này chưa có video demo");
    return;
  }

  document.getElementById('player').innerHTML = `
    <video width="720" controls autoplay>
      <source src="${movie.videoUrl}" type="video/mp4">
    </video>
  `;
}
</script>
